name: Quota reset regression (fork validation)

on:
  push:
    branches: [validation/quota-reset-platforms]

permissions:
  contents: read

jobs:
  quota-reset:
    name: Quota reset on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - name: Install locked dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Install integrity-checked published native addon
        run: |
          bun -e '
          import * as fs from "node:fs/promises";
          import * as path from "node:path";
          import { createHash } from "node:crypto";
          const { version } = await Bun.file("packages/natives/package.json").json();
          const pkg = `@oh-my-pi/pi-natives-${process.platform}-${process.arch}`;
          const response = await fetch(`https://registry.npmjs.org/${pkg}/${version}`);
          if (!response.ok) throw new Error(`Native metadata HTTP ${response.status}`);
          const metadata = await response.json();
          const download = await fetch(metadata.dist.tarball);
          if (!download.ok) throw new Error(`Native tarball HTTP ${download.status}`);
          const bytes = new Uint8Array(await download.arrayBuffer());
          const [algorithm, expected] = metadata.dist.integrity.split("-");
          if (createHash(algorithm).update(bytes).digest("base64") !== expected) throw new Error("Native integrity mismatch");
          const temp = await fs.mkdtemp(path.join(process.env.RUNNER_TEMP, "omp-native-"));
          try {
            const archive = path.join(temp, "native.tgz");
            await Bun.write(archive, bytes);
            const unpack = Bun.spawn(["tar", "-xzf", "native.tgz"], { cwd: temp, stdout: "inherit", stderr: "inherit" });
            if (await unpack.exited !== 0) throw new Error("Native extraction failed");
            const source = path.join(temp, "package");
            for (const filename of await fs.readdir(source)) {
              if (filename.endsWith(".node")) {
                await fs.copyFile(path.join(source, filename), path.join("packages/natives/native", filename));
                console.log(`Installed ${pkg}@${version}: ${filename}`);
              }
            }
          } finally { await fs.rm(temp, { recursive: true, force: true }); }
          '
      - name: Run clock and real session retry regressions
        run: |
          bun test packages/utils/test/async.test.ts packages/coding-agent/test/agent-session-retry-cap.test.ts
      - name: Launch the source CLI
        run: bun packages/coding-agent/src/cli.ts --version
